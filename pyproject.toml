[project]
name = "osemosys-vs-pypsa"
version = "1.0.0"
description = "Capacity-expansion comparison of OSeMOSYS and PyPSA on identical inputs"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:numpy.ndarray size changed:RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
